pre-commit:
  commands:
    format:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    # TODO: react-doctor spin-loops at ~100% CPU indefinitely when invoked via
    # `lefthook run` (reproduces even outside an actual `git push`, and even
    # with --yes). Re-enable once root-caused. Run `pnpm react-doctor:diff`
    # manually in the meantime.
    # react-doctor:
    #   run: pnpm react-doctor:diff
