pre-commit:
  commands:
    format:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

pre-push:
  commands:
    # TODO: re-enable once typecheck + dead-code are green after the strip-down
    # typecheck:
    #   run: pnpm typecheck
    react-doctor:
      run: pnpm react-doctor:diff
