name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'kharcha-backend/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'kharcha-backend/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kharcha-backend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck
